name: eval verifier sanity

# Verifier self-check: for every task under eval/tasks/, the oracle
# (reference solution) must score 1.0 and nop (do nothing) must score 0.0,
# 5 attempts each. This validates the tasks/verifiers themselves —
# judge-based criteria included (the judges run against the reference
# reply artifact, so this also exercises the judge plumbing).

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "eval/**"
      - ".github/workflows/eval-verifier.yml"

jobs:
  oracle-nop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install harbor CLI
        run: uv tool install harbor

      - name: Install eval project
        working-directory: eval
        run: uv sync

      - name: Verify tasks (oracle=1.0, nop=0.0, 5 attempts each)
        working-directory: eval
        run: uv run python scripts/verify_tasks.py 5
        env:
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}

      - name: Upload job results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-jobs
          path: eval/jobs
