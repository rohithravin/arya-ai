schema_version = "1.3"

[task]
name = "arya/notes-note-correction"
authors = [{ name = "Rohith Ravindranath", email = "rohithravin@gmail.com" }]
description = "Arya corrects an outdated decision note in place rather than appending a contradiction."

[metadata]
difficulty_explanation = "Single turn on a seeded note; verifies the stale text is gone from the live vault and the correction present."
category = "notes"

[agent]
timeout_sec = 600.0

[verifier]
timeout_sec = 300.0

[environment]
network_mode = "allowlist"
allowed_hosts = ["api.fireworks.ai", "pypi.org", "files.pythonhosted.org"]
workdir = "/workdir"
