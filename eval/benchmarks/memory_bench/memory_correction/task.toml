schema_version = "1.3"

[task]
name = "arya/memory-correction"
authors = [{ name = "Rohith Ravindranath", email = "rohithravin@gmail.com" }]
description = "Arya corrects a previously saved memory via supersession."

[metadata]
difficulty_explanation = "Single conversational turn against a pre-seeded store; verifies the stale row is superseded (inactive, chained to the new row) and the corrected fact saved."
category = "memory"

[agent]
timeout_sec = 300.0

[verifier]
timeout_sec = 300.0

[verifier.env]
FIREWORKS_API_KEY = "${FIREWORKS_API_KEY}"

[environment]
network_mode = "allowlist"
allowed_hosts = ["api.fireworks.ai", "pypi.org", "files.pythonhosted.org"]
workdir = "/workdir"
