schema_version = "1.3"

[task]
name = "arya/memory-category"
authors = [{ name = "Rohith Ravindranath", email = "rohithravin@gmail.com" }]
description = "Arya saves two facts in one turn with the correct categories."

[metadata]
difficulty_explanation = "Single conversational turn with two facts of different kinds; verifies both are saved under the right category."
category = "memory"

[agent]
timeout_sec = 300.0

[verifier]
timeout_sec = 300.0

[verifier.env]
FIREWORKS_API_KEY = "${FIREWORKS_API_KEY}"

[environment]
network_mode = "allowlist"
allowed_hosts = ["api.fireworks.ai", "pypi.org", "files.pythonhosted.org"]
workdir = "/workdir"
