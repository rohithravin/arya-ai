schema_version = "1.3"

[task]
name = "arya/memory-recall-miss"
authors = [{ name = "Rohith Ravindranath", email = "rohithravin@gmail.com" }]
description = "Arya acknowledges not knowing a fact that was never saved."

[metadata]
difficulty_explanation = "Single conversational turn against a pre-seeded store; verifies the agent admits it does not have the asked-for fact instead of confabulating."
category = "memory"

[agent]
timeout_sec = 300.0

[verifier]
timeout_sec = 300.0

[verifier.env]
FIREWORKS_API_KEY = "${FIREWORKS_API_KEY}"

[environment]
network_mode = "allowlist"
allowed_hosts = ["api.fireworks.ai", "pypi.org", "files.pythonhosted.org"]
workdir = "/workdir"
